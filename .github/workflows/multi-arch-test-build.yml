name: Test Build

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        board:
          - omnia
          - omnia-ng
          - mox
          - turris1x

    name: Turris ${{ matrix.board }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The SDK checks the build prerequisites of OpenWrt on its first run
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file gawk gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip \
            wget zlib1g-dev zstd

      - name: Determine the Turris OS branch and the changed packages
        run: bash .github/workflows/sdk-build.sh select
        env:
          PUSH_BEFORE: ${{ github.event.before }}

      # The compiler cache and the downloaded sources of the last run for the
      # same board and Turris OS branch
      - name: Cache ccache and downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/ccache
            ${{ runner.temp }}/dl
          key: sdk-${{ env.TOS_BRANCH }}-${{ matrix.board }}-${{ github.sha }}
          restore-keys: |
            sdk-${{ env.TOS_BRANCH }}-${{ matrix.board }}-

      - name: Prepare the SDK
        run: bash .github/workflows/sdk-build.sh prepare "${{ matrix.board }}"

      - name: Build
        run: bash .github/workflows/sdk-build.sh build

      - name: Store packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board }}-${{ env.TOS_BRANCH }}-packages
          path: artifacts/packages/
          if-no-files-found: ignore

      - name: Store logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board }}-${{ env.TOS_BRANCH }}-logs
          path: artifacts/logs/
          if-no-files-found: ignore
